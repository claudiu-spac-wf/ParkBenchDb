- name: DebitTransaction
  description: Money leaving an account
  class: T
  rows: 50000000
  scaling: linear
  area: PB_Txn_Debit
  indexArea: PB_Txn_Idx
  estimatedRecordBytes: 170
  fields:
  - name: AccountId
    type: INT64
    format: ">>>>>>>>>>>9"
    mandatory: true
    initial: "0"
    description: Reference to Account
    gen: skewed (active checking accounts dominate)
    fk:
      table: Account
      cardinality: 33 / 0–400 (skewed)
  - name: TransactionTypeId
    type: INT64
    format: ">>>>>>>>>>>9"
    mandatory: true
    initial: "0"
    description: Reference to TransactionType
    gen: POS 50%, ACH 12%, ATM 8%, XFER 12% (= Transfer rows), LOANPMT 6% (= LoanPayment rows in window), FEE 4%, other 8%
    fk:
      table: TransactionType
      indexed: false
      reason: Tiny parent; an index would have 60 distinct keys over 50M rows
      cardinality: 2,500,000 / 0–25,000,000 (POS 50%)
  - name: AccountStatementId
    type: INT64
    format: ">>>>>>>>>>>9"
    mandatory: true
    initial: "0"
    description: Reference to AccountStatement
    gen: 0 = not yet on a statement
    fk:
      table: AccountStatement
      optional: true
      cardinality: 2.8 / 0–40
  - name: MerchantId
    type: INT64
    format: ">>>>>>>>>>>9"
    mandatory: true
    initial: "0"
    description: Reference to Merchant
    gen: set for POS/ecommerce, otherwise 0
    fk:
      table: Merchant
      optional: true
      cardinality: 375 / 0–50,000 (Zipf; ≈ 60% of rows set)
  - name: PostedDate
    type: DATE
    format: 99/99/9999
    mandatory: true
    initial: "?"
    description: Business date the transaction posted
    gen: default (data-model §1.5)
  - name: PostedAt
    type: DATETIME-TZ
    format: "99/99/9999 HH:MM:SS.SSS+HH:MM"
    mandatory: true
    initial: "?"
    description: Timestamp the transaction posted
    gen: Diurnal distribution
  - name: Amount
    type: DECIMAL
    format: "->>>,>>>,>>>,>>9.99"
    decimals: 2
    mandatory: true
    initial: "0"
    description: Amount debited (positive)
    gen: "> 0; log-normal (median ≈ 35)"
  - name: RunningBalance
    type: DECIMAL
    format: "->>>,>>>,>>>,>>9.99"
    decimals: 2
    mandatory: true
    initial: "0"
    description: Balance after posting; may be negative
    gen: Balance after posting; may be negative
  - name: Description
    type: CHARACTER
    format: x(60)
    mandatory: true
    initial: ""
    description: Human-readable description
    gen: Merchant name or type description
  - name: ReferenceNumber
    type: CHARACTER
    format: x(20)
    mandatory: true
    initial: ""
    description: External reference number
    gen: default (data-model §1.5)
  - name: CheckNumber
    type: INTEGER
    format: ">>>>>9"
    mandatory: true
    initial: "0"
    description: Set on 1% of rows (checks)
    gen: Set on 1% of rows (checks)
  indexes:
  - name: IxAccountPosted
    unique: false
    word: false
    purpose: Transaction history, newest first
    components:
    - field: AccountId
      order: asc
    - field: PostedAt
      order: desc
  - name: IxAccountStatement
    unique: false
    word: false
