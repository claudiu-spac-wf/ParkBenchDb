- name: Employee
  description: Bank staff
  class: M
  rows: 5000
  scaling: linear
  area: PB_Ref_Data
  indexArea: PB_Ref_Idx
  estimatedRecordBytes: 330
  fields:
  - name: EmployeeNumber
    type: CHARACTER
    format: x(10)
    mandatory: true
    initial: ""
    description: Employee business key
    gen: E + 7 digits
  - name: BranchId
    type: INT64
    format: ">>>>>>>>>>>9"
    mandatory: true
    initial: "0"
    description: Reference to Branch
    gen: 15% at the head-office branch (BranchId 1)
    fk:
      table: Branch
      cardinality: 20 / 5–750 (head office ≈ 750)
  - name: FirstName
    type: CHARACTER
    format: x(30)
    mandatory: true
    initial: ""
    description: Given name
    gen: default (data-model §1.5)
  - name: LastName
    type: CHARACTER
    format: x(40)
    mandatory: true
    initial: ""
    description: Family name
    gen: default (data-model §1.5)
  - name: JobTitle
    type: CHARACTER
    format: x(40)
    mandatory: true
    initial: ""
    description: Job title
    gen: Teller, Banker, Loan Officer, Manager, Analyst…
  - name: Email
    type: CHARACTER
    format: x(80)
    mandatory: true
    initial: ""
    description: Email address
    gen: default (data-model §1.5)
  - name: HireDate
    type: DATE
    format: 99/99/9999
    mandatory: true
    initial: "?"
    description: Date the employee was hired
    gen: default (data-model §1.5)
  - name: TerminationDate
    type: DATE
    format: 99/99/9999
    mandatory: false
    initial: "?"
    description: Date employment ended
    gen: Set for 8% of rows
  - name: IsBranchManager
    type: LOGICAL
    format: yes/no
    mandatory: true
    initial: "no"
    description: Whether the employee manages their branch
    gen: Exactly one yes per branch
  - name: Salary
    type: DECIMAL
    format: "->>>,>>>,>>>,>>9.99"
    decimals: 2
    mandatory: true
    initial: "0"
    description: Annual salary
    gen: 35,000–250,000
  - name: Photo
    type: BLOB
    mandatory: false
    initial: "?"
    description: JPEG, 8–48 KB (avg 24 KB); present on 80% of rows. Area PB_Lob_Doc
    gen: JPEG, 8–48 KB (avg 24 KB); present on 80% of rows. Area PB_Lob_Doc
    lob:
      area: PB_Lob_Doc
      maxSize: 64K
      content: JPEG
      fractionPopulated: 0.8
      avgBytes: 24576
      minBytes: 8192
      maxBytes: 49152
  indexes:
  - name: UxEmployeeNumber
    unique: true
    word: false
    purpose: Lookup
    components:
    - field: EmployeeNumber
      order: asc
  - name: IxBranch
    unique: false
    word: false
