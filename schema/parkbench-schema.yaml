# ParkBenchDB schema source — the single source of truth.
# Format: specs/001-banking-benchmark-schema/contracts/schema-source-format.md
# Design:  specs/001-banking-benchmark-schema/data-model.md
# Generated docs (docs/schema/) are produced from this file by tools/gen_docs.py; never edit them by hand.

schema:
  name: ParkBenchDB
  target: "OpenEdge 12.8"
  blockSizeBytes: 8192
  asOfDateRule: "last day of the month before the load"
  historyMonths: 12

# Injected at the start of every table, in this order ({Table} = table name). data-model.md §1.1
standardFields:
  - name: "{Table}Id"
    type: INT64
    format: ">>>>>>>>>>>9"
    mandatory: true
    initial: "0"
    description: "Dense sequential identifier, 1..N with no gaps after the initial load. Runtime inserts use NEXT-VALUE(Seq{Table}Id)."
    gen: "Assigned 1..N in load order"
  - name: RandomInt10
    type: INTEGER
    format: ">9"
    mandatory: true
    initial: "0"
    description: "Independent uniform random value 1–10 for selecting ≈ 10% subsets. 0 = unassigned (invalid)."
    gen: "Independent uniform 1–10; 0 = unassigned (invalid)"
  - name: RandomInt100
    type: INTEGER
    format: ">>9"
    mandatory: true
    initial: "0"
    description: "Independent uniform random value 1–100 for selecting ≈ 1% subsets. 0 = unassigned (invalid)."
    gen: "Independent uniform 1–100; 0 = unassigned (invalid)"
  - name: RandomInt1000
    type: INTEGER
    format: ">>>9"
    mandatory: true
    initial: "0"
    description: "Independent uniform random value 1–1000 for selecting ≈ 0.1% subsets. 0 = unassigned (invalid)."
    gen: "Independent uniform 1–1000; 0 = unassigned (invalid)"
  - name: CreatedAt
    type: DATETIME-TZ
    format: "99/99/9999 HH:MM:SS.SSS+HH:MM"
    mandatory: true
    initial: "NOW"
    description: "When the row was created. For historical rows, a synthetic timestamp consistent with the row's business date."
    gen: "Consistent with the row's business date; NOW for runtime inserts"

# Appended as the last field of every class M (master) table.
masterFields:
  - name: UpdatedAt
    type: DATETIME-TZ
    format: "99/99/9999 HH:MM:SS.SSS+HH:MM"
    mandatory: true
    initial: "NOW"
    description: "Last modification time; equals CreatedAt right after the load."
    gen: "Equal to CreatedAt at load"

# Injected at the start of every table's index list. data-model.md §1.2
standardIndexes:
  - name: "Pk{Table}"
    primary: true
    unique: true
    purpose: "Single-row random access by sequential ID; default scan order"
    components:
      - { field: "{Table}Id", order: asc }
  - name: IxRandomInt10
    unique: false
    purpose: "Select ≈ 10% of rows (RandomInt10 = k)"
    components:
      - { field: RandomInt10, order: asc }
      - { field: "{Table}Id", order: asc }
  - name: IxRandomInt100
    unique: false
    purpose: "Select ≈ 1% of rows (RandomInt100 = k)"
    components:
      - { field: RandomInt100, order: asc }
      - { field: "{Table}Id", order: asc }
  - name: IxRandomInt1000
    unique: false
    purpose: "Select ≈ 0.1% of rows (RandomInt1000 = k)"
    components:
      - { field: RandomInt1000, order: asc }
      - { field: "{Table}Id", order: asc }

# Storage areas (Type II, 8 KB blocks). research.md R9
areas:
  - { name: PB_Ref_Data, kind: data, recordsPerBlock: 64, blocksPerCluster: 8, description: "All Tiny and Small tables (exempt from the RPB formula; waste is negligible under 100k rows)" }
  - { name: PB_Master_Narrow, kind: data, recordsPerBlock: 32, blocksPerCluster: 64, description: "Medium Narrow tables" }
  - { name: PB_Master_Std, kind: data, recordsPerBlock: 16, blocksPerCluster: 64, description: "Medium Standard and LOB-bearing tables" }
  - { name: PB_Master_Wide, kind: data, recordsPerBlock: 8, blocksPerCluster: 64, description: "Medium Wide tables" }
  - { name: PB_Txn_Debit, kind: data, recordsPerBlock: 32, blocksPerCluster: 512, description: "DebitTransaction (Very Large) in its own area" }
  - { name: PB_Txn_CardAuth, kind: data, recordsPerBlock: 64, blocksPerCluster: 512, description: "CardAuthorization (Very Large) in its own area" }
  - { name: PB_Txn_Audit, kind: data, recordsPerBlock: 32, blocksPerCluster: 512, description: "AuditLog (Very Large) in its own area" }
  - { name: PB_Txn_Large, kind: data, recordsPerBlock: 32, blocksPerCluster: 512, description: "Large transactional tables" }
  - { name: PB_Ref_Idx, kind: index, blocksPerCluster: 8, description: "Indexes of PB_Ref_Data tables" }
  - { name: PB_Master_Idx, kind: index, blocksPerCluster: 64, description: "Indexes of Medium tables" }
  - { name: PB_Txn_Idx, kind: index, blocksPerCluster: 512, description: "Indexes of Large and Very Large tables" }
  - { name: PB_Lob_Doc, kind: lob, blocksPerCluster: 512, description: "Binary documents and images (Employee.Photo, CustomerDocument.Content)" }
  - { name: PB_Lob_Stmt, kind: lob, blocksPerCluster: 512, description: "Rendered statements (StatementDocument.PdfContent, StatementDocument.StatementXml)" }
  - { name: PB_Lob_Text, kind: lob, blocksPerCluster: 512, description: "Long text (CustomerNote.NoteText, AccountStatement.NoticeText)" }

tables:
- name: Currency
  description: ISO currencies
  class: R
  rows: 40
  scaling: fixed
  area: PB_Ref_Data
  indexArea: PB_Ref_Idx
  estimatedRecordBytes: 70
  notes: "ISO 4217 currencies. Gen: the 40 most-traded currencies; USD is CurrencyId 1."
  fields:
  - name: CurrencyCode
    type: CHARACTER
    format: x(3)
    mandatory: true
    initial: ""
    description: ISO currency code
    gen: ISO alpha code, e.g. USD
  - name: CurrencyName
    type: CHARACTER
    format: x(40)
    mandatory: true
    initial: ""
    description: Currency name
    gen: e.g. US Dollar
  - name: NumericCode
    type: INTEGER
    format: "999"
    mandatory: true
    initial: "0"
    description: ISO numeric code
    gen: ISO numeric code
  - name: MinorUnits
    type: INTEGER
    format: "9"
    mandatory: true
    initial: "2"
    description: Decimal places used by the currency
    gen: Decimal places (0, 2 or 3)
  - name: CurrencySymbol
    type: CHARACTER
    format: x(5)
    mandatory: false
    initial: ""
    description: Currency symbol
    gen: e.g. $
  - name: IsActive
    type: LOGICAL
    format: yes/no
    mandatory: true
    initial: "yes"
    description: Whether the row is active
    gen: 95% yes
  indexes:
  - name: UxCurrencyCode
    unique: true
    word: false
    purpose: Lookup by code; target of character FKs
    components:
    - field: CurrencyCode
      order: asc
- name: Country
  description: ISO countries with default currency
  class: R
  rows: 250
  scaling: fixed
  area: PB_Ref_Data
  indexArea: PB_Ref_Idx
  estimatedRecordBytes: 80
  fields:
  - name: CountryCode
    type: CHARACTER
    format: x(2)
    mandatory: true
    initial: ""
    description: ISO country code
    gen: ISO 3166 alpha-2
  - name: CountryName
    type: CHARACTER
    format: x(60)
    mandatory: true
    initial: ""
    description: Country name
    gen: default (data-model §1.5)
  - name: DefaultCurrencyCode
    type: CHARACTER
    format: x(3)
    mandatory: true
    initial: ""
    description: Reference to Currency
    gen: Random existing parent row, respecting the cardinality
    fk:
      table: Currency
      field: CurrencyCode
      cardinality: 6 / 1–60
  - name: PhonePrefix
    type: CHARACTER
    format: x(6)
    mandatory: false
    initial: ""
    description: International dialling prefix
    gen: e.g. +1
  indexes:
  - name: UxCountryCode
    unique: true
    word: false
    purpose: Lookup by code
    components:
    - field: CountryCode
      order: asc
  - name: IxDefaultCurrency
    unique: false
    word: false
    purpose: Countries using a currency
    components:
    - field: DefaultCurrencyCode
      order: asc
- name: ExchangeRate
  description: Daily rate between two currencies
  class: R
  rows: 14235
  scaling: fixed
  area: PB_Ref_Data
  indexArea: PB_Ref_Idx
  estimatedRecordBytes: 70
  notes: Daily rate from each non-USD currency to USD, over the 12-month history window.
  fields:
  - name: RateDate
    type: DATE
    format: 99/99/9999
    mandatory: true
    initial: "?"
    description: Date the rate applies to
    gen: Each day in the window
  - name: FromCurrencyCode
    type: CHARACTER
    format: x(3)
    mandatory: true
    initial: ""
    description: Reference to Currency
    gen: every currency except USD
    fk:
      table: Currency
      field: CurrencyCode
      cardinality: 356 / 0–365 (USD has 0)
  - name: ToCurrencyCode
    type: CHARACTER
    format: x(3)
    mandatory: true
    initial: ""
    description: Reference to Currency
    gen: always USD
    fk:
      table: Currency
      field: CurrencyCode
      indexed: false
      reason: Always USD; second component of UxCurrencyPairDate
      cardinality: 356 / 0–14,235 (all rows reference USD)
  - name: Rate
    type: DECIMAL
    format: ">>>>>9.99999999"
    decimals: 8
    mandatory: true
    initial: "0"
    description: Exchange rate
    gen: Random walk ±0.5% per day from a realistic seed value
  - name: RateSource
    type: CHARACTER
    format: x(10)
    mandatory: true
    initial: ""
    description: Source of the rate
    gen: ECB, FED, INTERNAL
  indexes:
  - name: UxCurrencyPairDate
    unique: true
    word: false
    purpose: Latest rate for a pair
    components:
    - field: FromCurrencyCode
      order: asc
    - field: ToCurrencyCode
      order: asc
    - field: RateDate
      order: desc
- name: Branch
