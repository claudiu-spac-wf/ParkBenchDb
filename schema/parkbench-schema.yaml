- name: Transfer
  description: Movement between two accounts, linking one debit and one credit
  class: T
  rows: 6000000
  scaling: linear
  area: PB_Txn_Large
  indexArea: PB_Txn_Idx
  estimatedRecordBytes: 100
  notes: Each transfer creates one DebitTransaction on the source account and one CreditTransaction on the destination account,
    both with transaction type XFER.
  fields:
  - name: FromAccountId
    type: INT64
    format: ">>>>>>>>>>>9"
    mandatory: true
    initial: "0"
    description: Reference to Account
    gen: Random existing parent row, respecting the cardinality
    fk:
      table: Account
      cardinality: 4 / 0–50
  - name: ToAccountId
    type: INT64
    format: ">>>>>>>>>>>9"
    mandatory: true
    initial: "0"
    description: Reference to Account
    gen: Random existing parent row, respecting the cardinality
    fk:
      table: Account
      cardinality: 4 / 0–50
  - name: Amount
    type: DECIMAL
    format: "->>>,>>>,>>>,>>9.99"
    decimals: 2
    mandatory: true
    initial: "0"
    description: Amount transferred
    gen: default (data-model §1.5)
  - name: TransferDateTime
    type: DATETIME-TZ
    format: "99/99/9999 HH:MM:SS.SSS+HH:MM"
    mandatory: true
    initial: "?"
    description: When the transfer was made
    gen: default (data-model §1.5)
  - name: DebitTransactionId
    type: INT64
    format: ">>>>>>>>>>>9"
    mandatory: true
    initial: "0"
    description: Reference to DebitTransaction
    gen: Random existing parent row, respecting the cardinality
    fk:
      table: DebitTransaction
      cardinality: 0.12 / 0–1
  - name: CreditTransactionId
    type: INT64
    format: ">>>>>>>>>>>9"
    mandatory: true
    initial: "0"
    description: Reference to CreditTransaction
    gen: Random existing parent row, respecting the cardinality
    fk:
      table: CreditTransaction
      indexed: false
      reason: Reverse lookup handled through the debit side
      cardinality: 0.33 / 0–1
  - name: TransferStatus
    type: CHARACTER
    format: x(10)
    mandatory: true
    initial: POSTED
    description: Lifecycle status
    gen: Always POSTED at load
  - name: Channel
    type: CHARACTER
    format: x(8)
    mandatory: true
    initial: ONLINE
    description: ONLINE, MOBILE, BRANCH
    gen: ONLINE, MOBILE, BRANCH
  indexes:
  - name: IxFromAccount
    unique: false
    word: false
    purpose: Outgoing transfers
    components:
    - field: FromAccountId
      order: asc
    - field: TransferDateTime
      order: asc
  - name: IxToAccount
    unique: false
    word: false
    purpose: Incoming transfers
    components:
    - field: ToAccountId
      order: asc
    - field: TransferDateTime
      order: asc
  - name: UxDebitTransaction
    unique: true
    word: false
    purpose: Reverse link from a debit
    components:
    - field: DebitTransactionId
      order: asc
